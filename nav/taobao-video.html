<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="批量还原淘宝短链并解析淘宝逛逛原视频。" />
  <title>淘宝视频批量解析</title>
  <style>
    :root{color-scheme:dark;--bg:#080b12;--panel:rgba(18,24,36,.86);--line:rgba(255,255,255,.12);--text:#f7f8fb;--muted:#9ca6b8;--orange:#ff764a;--green:#56d68a}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:radial-gradient(circle at 15% 5%,rgba(255,118,74,.17),transparent 34rem),radial-gradient(circle at 85% 88%,rgba(115,148,255,.12),transparent 30rem),var(--bg)}
    main{width:min(980px,calc(100% - 32px));margin:auto;padding:34px 0 54px}.back{color:var(--muted);text-decoration:none;font-weight:650}h1{margin:30px 0 10px;font-size:clamp(2.3rem,7vw,4.7rem);line-height:1;letter-spacing:-.05em}.lead,.note{color:var(--muted);line-height:1.7}
    .panel{margin-top:28px;padding:clamp(20px,4vw,32px);border:1px solid var(--line);border-radius:26px;background:var(--panel);box-shadow:0 22px 70px rgba(0,0,0,.26)}
    textarea{width:100%;min-height:190px;padding:17px;border:1px solid var(--line);border-radius:18px;resize:vertical;color:var(--text);background:rgba(0,0,0,.28);font:inherit;line-height:1.6;outline:none}textarea:focus{border-color:rgba(255,118,74,.75);box-shadow:0 0 0 4px rgba(255,118,74,.1)}
    .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}button,.action{min-height:46px;display:inline-flex;align-items:center;justify-content:center;padding:0 19px;border:0;border-radius:999px;color:#170703;background:var(--orange);font:inherit;font-weight:760;cursor:pointer;text-decoration:none}.secondary{color:var(--text);background:rgba(255,255,255,.08);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:wait}
    .results{display:grid;gap:12px;margin-top:24px}.item{padding:16px;border:1px solid var(--line);border-radius:18px;background:rgba(0,0,0,.23)}.item-head{display:flex;justify-content:space-between;gap:14px}.badge{color:var(--green);font-size:.88rem;font-weight:700}.bad{color:#ff8585}.source,.url{margin-top:9px;overflow-wrap:anywhere;color:var(--muted);font-size:.84rem;line-height:1.5}.item .actions{margin-top:12px}.item .action{min-height:38px;padding:0 14px;font-size:.88rem}
    @media(max-width:600px){main{width:min(100% - 24px,560px)}.panel{border-radius:22px}.actions>button{flex:1}.item-head{display:block}.badge{display:block;margin-top:6px}}
  </style>
</head>
<body>
  <main>
    <a class="back" href="./index.html">← 返回导航</a>
    <h1>淘宝视频批量解析</h1>
    <p class="lead">每行粘贴一个淘宝分享链接，也可以直接粘贴多段分享文案。支持短链还原与淘宝逛逛视频批量解析。</p>
    <section class="panel">
      <label for="source">淘宝分享内容</label>
      <textarea id="source" placeholder="每行一个链接或直接粘贴多段淘宝分享文案"></textarea>
      <div class="actions">
        <button id="restore">还原短链</button>
        <button id="parse">批量解析视频</button>
        <button class="secondary" id="clear">清空</button>
      </div>
      <section class="results" id="results" aria-live="polite"></section>
      <p class="note">一次最多处理 20 条。短链只允许访问淘宝官方 <code>*.tb.cn</code>，解析结果不会保存。</p>
    </section>
  </main>
  <script>
    const source = document.querySelector("#source");
    const results = document.querySelector("#results");
    const buttons = [...document.querySelectorAll("button")];
    const shortHosts = new Set(["e.tb.cn", "m.tb.cn", "s.tb.cn", "c.tb.cn"]);

    const decode = (text) => {
      for (let i = 0; i < 3; i += 1) {
        try { const next = decodeURIComponent(text); if (next === text) break; text = next; } catch { break; }
      }
      return text;
    };

    const getInputs = () => {
      const urls = source.value.match(/https?:\/\/[^\s<>"']+/gi) || [];
      const unique = [...new Set(urls.map((url) => url.replace(/[，。；、]+$/, "")))];
      if (!unique.length && source.value.trim()) return [source.value.trim()];
      if (unique.length > 20) throw new Error("一次最多处理 20 条");
      if (!unique.length) throw new Error("请先粘贴淘宝链接");
      return unique;
    };

    const isShort = (value) => {
      try { return shortHosts.has(new URL(value).hostname); } catch { return false; }
    };

    const restoreUrl = async (value) => {
      if (!isShort(value)) return value;
      const response = await fetch("/api/resolve?url=" + encodeURIComponent(value));
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "短链还原失败");
      return data.url;
    };

    const parseVideo = (input) => {
      const text = decode(input.trim());
      const direct = text.match(/https?:\/\/[^\s"'<>]+\.mp4(?:\?[^\s"'<>]*)?/i);
      if (direct) return { url: direct[0].replace(/&amp;/g, "&"), id: null };
      const id = text.match(/["']?contentId["']?\s*[:=]\s*["']?(\d{10,})/i)?.[1]
        || text.match(/[?&](?:contentId|id)=(\d{10,})/i)?.[1];
      if (!id) throw new Error("没有找到淘宝逛逛 contentId");
      // ponytail: current public Guangguang CDN rule; add an API fallback only if Taobao changes it.
      return { id, url: `https://cloud.video.taobao.com/play/u/null/p/1/e/6/t/1/${id}.mp4` };
    };

    const escapeHtml = (value) => value.replace(/[&<>"']/g, (char) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[char]));
    const render = (items) => {
      results.innerHTML = items.map((item, index) => `
        <article class="item">
          <div class="item-head"><strong>第 ${index + 1} 条</strong><span class="badge ${item.error ? "bad" : ""}">${item.error || item.status}</span></div>
          <div class="source">原链接：${escapeHtml(item.source)}</div>
          ${item.resolved ? `<div class="url">还原结果：${escapeHtml(item.resolved)}</div>` : ""}
          ${item.video ? `<div class="url">视频地址：${escapeHtml(item.video)}</div><div class="actions"><a class="action" href="${escapeHtml(item.video)}" target="_blank" rel="noopener noreferrer">打开原视频</a><button class="action secondary copy" data-url="${escapeHtml(item.video)}">复制地址</button></div>` : ""}
        </article>`).join("");
      document.querySelectorAll(".copy").forEach((button) => button.addEventListener("click", async () => {
        await navigator.clipboard.writeText(button.dataset.url);
        button.textContent = "已复制";
      }));
    };

    const run = async (withVideo) => {
      let inputs;
      try { inputs = getInputs(); } catch (error) { render([{ source: "-", error: error.message }]); return; }
      buttons.forEach((button) => button.disabled = true);
      const items = await Promise.all(inputs.map(async (input) => {
        const item = { source: input };
        try {
          item.resolved = await restoreUrl(input);
          if (withVideo) {
            const video = parseVideo(item.resolved);
            item.video = video.url;
            item.status = video.id ? `解析成功 · ${video.id}` : "已提取视频地址";
          } else item.status = isShort(input) ? "短链还原成功" : "已经是长链接";
        } catch (error) { item.error = error.message; }
        return item;
      }));
      render(items);
      buttons.forEach((button) => button.disabled = false);
    };

    document.querySelector("#restore").addEventListener("click", () => run(false));
    document.querySelector("#parse").addEventListener("click", () => run(true));
    document.querySelector("#clear").addEventListener("click", () => { source.value = ""; results.innerHTML = ""; source.focus(); });

    console.assert(parseVideo('extParams=%7B%22contentId%22%3A%22560747209489%22%7D').id === "560747209489");
    console.assert(getInputs.bind(null) && isShort("https://e.tb.cn/h.test"));
  </script>
</body>
</html>
