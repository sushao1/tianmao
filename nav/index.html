<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="苏少常用网页工具导航。"
    />
    <title>苏少工具导航</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2310141f'/%3E%3Cpath d='M18 21h28M18 32h18M18 43h24' stroke='%237c9cff' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #080b12;
        --surface: rgba(20, 25, 38, 0.78);
        --surface-hover: rgba(26, 33, 50, 0.94);
        --line: rgba(255, 255, 255, 0.1);
        --text: #f6f7fb;
        --muted: #9ca6b8;
        --blue: #7394ff;
        --cyan: #44d8ce;
        --orange: #ff8a5b;
        --green: #56d68a;
        --red: #ff684d;
      }

      * { box-sizing: border-box; }

      html { min-height: 100%; }

      body {
        min-height: 100vh;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 12% 8%, rgba(115, 148, 255, 0.16), transparent 34rem),
          radial-gradient(circle at 90% 86%, rgba(68, 216, 206, 0.1), transparent 30rem),
          var(--bg);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.22;
        background-image:
          linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: linear-gradient(to bottom, black, transparent 78%);
      }

      main {
        position: relative;
        width: min(1080px, calc(100% - 40px));
        margin: 0 auto;
        padding: clamp(64px, 10vh, 112px) 0 56px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 18px;
        color: #b9c4d8;
        font-size: 0.875rem;
        font-weight: 650;
        letter-spacing: 0.08em;
      }

      .eyebrow::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--cyan);
        box-shadow: 0 0 18px rgba(68, 216, 206, 0.75);
      }

      h1 {
        margin: 0;
        max-width: 760px;
        font-size: clamp(2.55rem, 7vw, 5.35rem);
        line-height: 0.98;
        letter-spacing: -0.055em;
      }

      .lead {
        margin: 22px 0 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.15rem);
        line-height: 1.7;
      }

      .tools {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
        margin-top: clamp(44px, 8vh, 78px);
      }

      .tool {
        position: relative;
        min-height: 330px;
        display: flex;
        flex-direction: column;
        padding: 30px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 28px;
        color: inherit;
        text-decoration: none;
        background: var(--surface);
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(18px);
        transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
      }

      .tool::after {
        content: "";
        position: absolute;
        width: 210px;
        height: 210px;
        right: -70px;
        bottom: -90px;
        border-radius: 50%;
        background: var(--glow);
        filter: blur(8px);
        opacity: 0.18;
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .tool:hover,
      .tool:focus-visible {
        transform: translateY(-5px);
        border-color: rgba(255, 255, 255, 0.22);
        background: var(--surface-hover);
        outline: none;
      }

      .tool:hover::after,
      .tool:focus-visible::after {
        opacity: 0.3;
        transform: scale(1.08);
      }

      .review { --glow: var(--orange); }
      .compress { --glow: var(--blue); }
      .audio { --glow: var(--green); }
      .taobao-video { --glow: var(--red); }

      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .icon {
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.09);
      }

      .icon svg {
        width: 29px;
        height: 29px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .review .icon { color: #ffa178; }
      .compress .icon { color: #90a9ff; }
      .audio .icon { color: #7df0a7; }
      .taobao-video .icon { color: #ff8a72; }

      .index {
        color: #778196;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.12em;
      }

      .tool h2 {
        margin: 42px 0 10px;
        font-size: clamp(1.65rem, 4vw, 2.25rem);
        letter-spacing: -0.035em;
      }

      .tool p {
        max-width: 390px;
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.65;
      }

      .open {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: auto;
        padding-top: 36px;
        color: #e9ecf4;
        font-size: 0.95rem;
        font-weight: 700;
      }

      .open span {
        display: grid;
        width: 31px;
        height: 31px;
        place-items: center;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        transition: transform 180ms ease, background 180ms ease;
      }

      .tool:hover .open span,
      .tool:focus-visible .open span {
        transform: translateX(4px);
        background: rgba(255, 255, 255, 0.16);
      }

      footer {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin-top: 28px;
        color: #717b8e;
        font-size: 0.82rem;
      }

      @media (max-width: 720px) {
        main { width: min(100% - 28px, 560px); padding-top: 54px; }
        h1 { font-size: clamp(2.6rem, 15vw, 4.2rem); }
        .tools { grid-template-columns: 1fr; margin-top: 42px; }
        .tool { min-height: 290px; padding: 24px; border-radius: 24px; }
        .tool h2 { margin-top: 32px; }
        footer { flex-direction: column; gap: 7px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">常用网页工具</div>
      <h1>苏少工具导航</h1>
      <p class="lead">选择需要的工具，点击卡片即可打开。</p>

      <section class="tools" aria-label="网页工具">
        <a class="tool review" href="https://tianmao-taupe.vercel.app/" target="_blank" rel="noopener noreferrer">
          <div class="topline"><div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 4.8h14v14.4H5z"/><path d="M8 8h8M8 11.5h5M8 15h3"/></svg></div><span class="index">01</span></div>
          <h2>淘宝评价预览</h2><p>查看淘宝买家评价的手机端展示效果。</p><div class="open">打开网页 <span aria-hidden="true">→</span></div>
        </a>
        <a class="tool compress" href="https://jiyatu.vercel.app/" target="_blank" rel="noopener noreferrer">
          <div class="topline"><div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 3v5H3M16 3v5h5M8 21v-5H3M16 21v-5h5"/><path d="m3 8 5-5m8 0 5 5M3 16l5 5m8 0 5-5"/></svg></div><span class="index">02</span></div>
          <h2>极压图</h2><p>批量压缩图片、调整尺寸，并快速打包下载。</p><div class="open">打开网页 <span aria-hidden="true">→</span></div>
        </a>
        <a class="tool audio" href="./ncm-converter.html" target="_blank" rel="noopener noreferrer">
          <div class="topline"><div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></div><span class="index">03</span></div>
          <h2>NCM 转 MP3</h2><p>批量选择网易云 ncm 文件，在浏览器里转换并下载。</p><div class="open">打开网页 <span aria-hidden="true">→</span></div>
        </a>
        <a class="tool taobao-video" href="./taobao-video.html" target="_blank" rel="noopener noreferrer">
          <div class="topline"><div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 7 8 5-8 5z"/><rect x="3" y="4" width="18" height="16" rx="3"/></svg></div><span class="index">04</span></div>
          <h2>淘宝视频解析</h2><p>还原淘宝短链，批量解析并打开逛逛原视频。</p><div class="open">打开网页 <span aria-hidden="true">→</span></div>
        </a>
      </section>

      <footer><span>4 个网页工具</span><span>桌面与手机均可使用</span></footer>
    </main>
  </body>
</html>
