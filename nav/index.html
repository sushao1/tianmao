<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="苏少常用网页工具导航：淘宝评价预览与极压图。"
    />
    <title>苏少工具导航</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2310141f'/%3E%3Cpath d='M18 21h28M18 32h18M18 43h24' stroke='%237c9cff' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #080b12;
        --surface: rgba(20, 25, 38, 0.78);
        --surface-hover: rgba(26, 33, 50, 0.94);
        --line: rgba(255, 255, 255, 0.1);
        --text: #f6f7fb;
        --muted: #9ca6b8;
        --blue: #7394ff;
        --cyan: #44d8ce;
        --orange: #ff8a5b;
        --green: #56d68a;
      }

      * { box-sizing: border-box; }

      html { min-height: 100%; }

      body {
        min-height: 100vh;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 12% 8%, rgba(115, 148, 255, 0.16), transparent 34rem),
          radial-gradient(circle at 90% 86%, rgba(68, 216, 206, 0.1), transparent 30rem),
          var(--bg);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.22;
        background-image:
          linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: linear-gradient(to bottom, black, transparent 78%);
      }

      main {
        position: relative;
        width: min(1080px, calc(100% - 40px));
        margin: 0 auto;
        padding: clamp(64px, 10vh, 112px) 0 56px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 18px;
        color: #b9c4d8;
        font-size: 0.875rem;
        font-weight: 650;
        letter-spacing: 0.08em;
      }

      .eyebrow::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--cyan);
        box-shadow: 0 0 18px rgba(68, 216, 206, 0.75);
      }

      h1 {
        margin: 0;
        max-width: 760px;
        font-size: clamp(2.55rem, 7vw, 5.35rem);
        line-height: 0.98;
        letter-spacing: -0.055em;
      }

      .lead {
        margin: 22px 0 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.15rem);
        line-height: 1.7;
      }

      .tools {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
        margin-top: clamp(44px, 8vh, 78px);
      }

      .tool {
        position: relative;
        min-height: 330px;
        display: flex;
        flex-direction: column;
        padding: 30px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 28px;
        color: inherit;
        text-decoration: none;
        background: var(--surface);
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(18px);
        transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
      }

      .tool::after {
        content: "";
        position: absolute;
        width: 210px;
        height: 210px;
        right: -70px;
        bottom: -90px;
        border-radius: 50%;
        background: var(--glow);
        filter: blur(8px);
        opacity: 0.18;
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .tool:hover,
      .tool:focus-visible {
        transform: translateY(-5px);
        border-color: rgba(255, 255, 255, 0.22);
        background: var(--surface-hover);
        outline: none;
      }

      .tool:hover::after,
      .tool:focus-visible::after {
        opacity: 0.3;
        transform: scale(1.08);
      }

      .review { --glow: var(--orange); }
      .compress { --glow: var(--blue); }
      .audio { --glow: var(--green); }

      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .icon {
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.09);
      }

      .icon svg {
        width: 29px;
        height: 29px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .review .icon { color: #ffa178; }
      .compress .icon { color: #90a9ff; }
      .audio .icon { color: #7df0a7; }

      .index {
        color: #778196;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.12em;
      }

      .tool h2 {
        margin: 42px 0 10px;
        font-size: clamp(1.65rem, 4vw, 2.25rem);
        letter-spacing: -0.035em;
      }

      .tool p {
        max-width: 390px;
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.65;
      }

      .open {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: auto;
        padding-top: 36px;
        color: #e9ecf4;
        font-size: 0.95rem;
        font-weight: 700;
      }

      .open span {
        display: grid;
        width: 31px;
        height: 31px;
        place-items: center;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        transition: transform 180ms ease, background 180ms ease;
      }

      .tool:hover .open span,
      .tool:focus-visible .open span {
        transform: translateX(4px);
        background: rgba(255, 255, 255, 0.16);
      }

      footer {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin-top: 28px;
        color: #717b8e;
        font-size: 0.82rem;
      }

      .converter-panel {
        display: none;
        margin-top: 28px;
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--surface);
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.25);
      }

      .converter-panel:target { display: block; }
      .converter-panel h2 { margin: 0 0 8px; font-size: clamp(1.8rem, 4vw, 2.5rem); letter-spacing: -0.035em; }
      .converter-panel p { color: var(--muted); line-height: 1.65; }
      .ncm-drop { position: relative; display: grid; place-items: center; min-height: 220px; margin-top: 20px; padding: 24px; border: 1px dashed rgba(255, 255, 255, 0.25); border-radius: 22px; text-align: center; background: rgba(255, 255, 255, 0.04); }
      .ncm-drop.dragover { border-color: rgba(86, 214, 138, 0.85); background: rgba(86, 214, 138, 0.08); }
      .ncm-drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
      .ncm-drop strong { display: block; margin-bottom: 8px; font-size: 1.2rem; }
      .ncm-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
      .ncm-actions button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px; font: inherit; font-weight: 760; color: #06100b; background: var(--green); cursor: pointer; }
      .ncm-actions button.secondary { color: var(--text); background: rgba(255,255,255,.1); border: 1px solid var(--line); }
      .ncm-actions button:disabled { opacity: .45; cursor: not-allowed; }
      .ncm-list { display: grid; gap: 10px; margin-top: 18px; }
      .ncm-item { display: grid; grid-template-columns: 1fr auto; gap: 14px; padding: 13px 15px; border: 1px solid var(--line); border-radius: 16px; background: rgba(0,0,0,.18); }
      .ncm-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .ncm-meta, .ncm-status { color: var(--muted); font-size: .86rem; }
      .ncm-ok { color: var(--green); }
      .ncm-bad { color: #ff7a7a; }

      @media (max-width: 720px) {
        main { width: min(100% - 28px, 560px); padding-top: 54px; }
        h1 { font-size: clamp(2.6rem, 15vw, 4.2rem); }
        .tools { grid-template-columns: 1fr; margin-top: 42px; }
        .tool { min-height: 290px; padding: 24px; border-radius: 24px; }
        .tool h2 { margin-top: 32px; }
        footer { flex-direction: column; gap: 7px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">常用网页工具</div>
      <h1>苏少工具导航</h1>
      <p class="lead">选择需要的工具，点击卡片即可打开。</p>

      <section class="tools" aria-label="网页工具">
        <a class="tool review" href="https://tianmao-taupe.vercel.app/" target="_blank" rel="noopener noreferrer">
          <div class="topline"><div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 4.8h14v14.4H5z"/><path d="M8 8h8M8 11.5h5M8 15h3"/></svg></div><span class="index">01</span></div>
          <h2>淘宝评价预览</h2><p>查看淘宝买家评价的手机端展示效果。</p><div class="open">打开网页 <span aria-hidden="true">→</span></div>
        </a>
        <a class="tool compress" href="https://jiyatu.vercel.app/" target="_blank" rel="noopener noreferrer">
          <div class="topline"><div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 3v5H3M16 3v5h5M8 21v-5H3M16 21v-5h5"/><path d="m3 8 5-5m8 0 5 5M3 16l5 5m8 0 5-5"/></svg></div><span class="index">02</span></div>
          <h2>极压图</h2><p>批量压缩图片、调整尺寸，并快速打包下载。</p><div class="open">打开网页 <span aria-hidden="true">→</span></div>
        </a>
        <a class="tool audio" href="#ncm-converter">
          <div class="topline"><div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></div><span class="index">03</span></div>
          <h2>NCM 转 MP3</h2><p>批量选择网易云 ncm 文件，在浏览器里转换并下载。</p><div class="open">打开网页 <span aria-hidden="true">→</span></div>
        </a>
      </section>

      <section class="converter-panel" id="ncm-converter" aria-label="NCM 转 MP3">
        <h2>NCM 转 MP3</h2><p>批量选择网易云音乐的 .ncm 文件，浏览器本地转换并自动下载。原文件不会上传。</p>
        <label class="ncm-drop" id="ncm-drop"><input id="ncm-picker" type="file" accept=".ncm" multiple /><span><strong>拖入或选择 ncm 文件</strong>可一次选择多个文件</span></label>
        <div class="ncm-actions"><button id="ncm-convert" disabled>开始转换</button><button class="secondary" id="ncm-clear" disabled>清空列表</button></div>
        <div class="ncm-list" id="ncm-list" aria-live="polite"></div><p>flac 会继续转成 mp3，大文件需要多等一会。</p>
      </section>

      <footer><span>3 个网页工具</span><span>桌面与手机均可使用</span></footer>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
    <script>
      const ncmFiles = [];
      const coreKey = CryptoJS.enc.Hex.parse("687A4852416D736F356B496E62617857");
      const metaKey = CryptoJS.enc.Hex.parse("2331346C6A6B5F215C5D2630553C2728");
      const picker = document.querySelector("#ncm-picker");
      const drop = document.querySelector("#ncm-drop");
      const list = document.querySelector("#ncm-list");
      const convert = document.querySelector("#ncm-convert");
      const clear = document.querySelector("#ncm-clear");
      const readU32 = (bytes, offset) => bytes[offset] | (bytes[offset + 1] << 8) | (bytes[offset + 2] << 16) | (bytes[offset + 3] << 24);
      const bytesToWordArray = (bytes) => { const words = []; for (let i = 0; i < bytes.length; i += 1) words[i >>> 2] |= bytes[i] << (24 - (i % 4) * 8); return CryptoJS.lib.WordArray.create(words, bytes.length); };
      const wordArrayToBytes = (wordArray) => { const bytes = new Uint8Array(wordArray.sigBytes); for (let i = 0; i < bytes.length; i += 1) bytes[i] = (wordArray.words[i >>> 2] >>> (24 - (i % 4) * 8)) & 255; return bytes; };
      const decryptEcb = (bytes, key) => wordArrayToBytes(CryptoJS.AES.decrypt({ ciphertext: bytesToWordArray(bytes) }, key, { mode: CryptoJS.mode.ECB, padding: CryptoJS.pad.Pkcs7 }));
      const makeKeyBox = (key) => { const box = new Uint8Array(256); for (let i = 0; i < 256; i += 1) box[i] = i; let last = 0, keyOffset = 0; for (let i = 0; i < 256; i += 1) { const swap = box[i]; const c = (swap + last + key[keyOffset]) & 255; keyOffset = (keyOffset + 1) % key.length; box[i] = box[c]; box[c] = swap; last = c; } return box; };
      const decodeMeta = (bytes, fallbackName) => { const xored = bytes.map((byte) => byte ^ 0x63); const text = new TextDecoder().decode(xored).replace(/^163 key\(Don't modify\):/, ""); try { const encrypted = Uint8Array.from(atob(text), (char) => char.charCodeAt(0)).slice(22); const json = new TextDecoder().decode(decryptEcb(encrypted, metaKey)).slice(6); return JSON.parse(json); } catch { return { musicName: fallbackName.replace(/\.ncm$/i, "") }; } };
      const floatToInt16 = (samples) => { const output = new Int16Array(samples.length); for (let i = 0; i < samples.length; i += 1) { const sample = Math.max(-1, Math.min(1, samples[i])); output[i] = sample < 0 ? sample * 32768 : sample * 32767; } return output; };
      const encodeMp3 = (audioBuffer) => { const channels = Math.min(2, audioBuffer.numberOfChannels); const encoder = new lamejs.Mp3Encoder(channels, audioBuffer.sampleRate, 192); const left = floatToInt16(audioBuffer.getChannelData(0)); const right = channels > 1 ? floatToInt16(audioBuffer.getChannelData(1)) : null; const chunks = []; for (let i = 0; i < left.length; i += 1152) { const mp3 = right ? encoder.encodeBuffer(left.subarray(i, i + 1152), right.subarray(i, i + 1152)) : encoder.encodeBuffer(left.subarray(i, i + 1152)); if (mp3.length) chunks.push(mp3); } const tail = encoder.flush(); if (tail.length) chunks.push(tail); return new Blob(chunks, { type: "audio/mpeg" }); };
      const toMp3 = async (audio) => { const head = new TextDecoder().decode(audio.slice(0, 3)); if (head === "ID3" || (audio[0] === 255 && (audio[1] & 224) === 224)) return new Blob([audio], { type: "audio/mpeg" }); const context = new (window.AudioContext || window.webkitAudioContext)(); try { const buffer = audio.buffer.slice(audio.byteOffset, audio.byteOffset + audio.byteLength); return encodeMp3(await context.decodeAudioData(buffer)); } finally { context.close(); } };
      const convertNcm = async (file) => { const bytes = new Uint8Array(await file.arrayBuffer()); if (new TextDecoder().decode(bytes.slice(0, 8)) !== "CTENFDAM") throw new Error("不是有效的 ncm 文件"); let offset = 10; const keyLen = readU32(bytes, offset); offset += 4; const encryptedKey = bytes.slice(offset, offset + keyLen).map((byte) => byte ^ 0x64); offset += keyLen; const key = decryptEcb(encryptedKey, coreKey).slice(17); const keyBox = makeKeyBox(key); const metaLen = readU32(bytes, offset); offset += 4; const meta = decodeMeta(bytes.slice(offset, offset + metaLen), file.name); offset += metaLen + 5; const imageSpace = readU32(bytes, offset); offset += 4; const imageLen = readU32(bytes, offset); offset += 4 + imageLen + (imageSpace - imageLen); const audio = bytes.slice(offset); for (let i = 0; i < audio.length; i += 1) { const j = (i + 1) & 255; audio[i] ^= keyBox[(keyBox[j] + keyBox[(keyBox[j] + j) & 255]) & 255]; } const title = (meta.musicName || file.name.replace(/\.ncm$/i, "")).replace(/[\\/:*?"<>|]/g, "_"); return { name: `${title}.mp3`, blob: await toMp3(audio) }; };
      const download = ({ name, blob }) => { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); };
      const renderNcm = () => { list.innerHTML = ncmFiles.map((file, index) => `<article class="ncm-item"><div><div class="ncm-name">${file.name}</div><div class="ncm-meta">${(file.size / 1024 / 1024).toFixed(1)} MB</div></div><div class="ncm-status" id="ncm-status-${index}">等待转换</div></article>`).join(""); convert.disabled = ncmFiles.length === 0; clear.disabled = ncmFiles.length === 0; };
      const addNcmFiles = (selected) => { for (const file of selected) if (/\.ncm$/i.test(file.name)) ncmFiles.push(file); renderNcm(); };
      picker.addEventListener("change", () => addNcmFiles(picker.files));
      clear.addEventListener("click", () => { ncmFiles.length = 0; picker.value = ""; renderNcm(); });
      ["dragenter", "dragover"].forEach((eventName) => drop.addEventListener(eventName, (event) => { event.preventDefault(); drop.classList.add("dragover"); }));
      ["dragleave", "drop"].forEach((eventName) => drop.addEventListener(eventName, (event) => { event.preventDefault(); drop.classList.remove("dragover"); }));
      drop.addEventListener("drop", (event) => addNcmFiles(event.dataTransfer.files));
      convert.addEventListener("click", async () => { convert.disabled = true; for (const [index, file] of ncmFiles.entries()) { const status = document.querySelector(`#ncm-status-${index}`); status.textContent = "转换中"; try { const output = await convertNcm(file); download(output); status.textContent = `已下载 ${output.name}`; status.className = "ncm-status ncm-ok"; } catch (error) { status.textContent = error.message || "转换失败"; status.className = "ncm-status ncm-bad"; } } convert.disabled = false; });
    </script>
  </body>
</html>
